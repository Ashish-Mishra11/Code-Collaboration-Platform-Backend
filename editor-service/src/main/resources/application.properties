spring.application.name=editor-service

server.port=8083
#register it to eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

#tell Spring to Load .env file also
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/codefile
spring.datasource.username=root
spring.datasource.password=${MYSQLPASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG
logging.level.com.codesync.auth=DEBUG


# -- SpringDoc OpenAPI --
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

# Force Swagger to use the Gateway URL for requests

# Ensure Swagger uses Gateway URL instead of direct port
server.forward-headers-strategy=framework

# Force Swagger to use relative URLs (fixes 'Failed to fetch' CORS errors)

# Final Fix: Explicitly set the Gateway as the API Server
springdoc.openapi.servers[0].url=http://localhost:8081
springdoc.openapi.servers[0].description=API Gateway (Centralized Entry)
