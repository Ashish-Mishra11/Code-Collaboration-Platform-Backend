# ======================
# Server Configuration
# ======================
server.port=8085

# ======================
# Application Name
# ======================
spring.application.name=version-service

# ======================
# Database Configuration
# ======================
spring.datasource.url=jdbc:mysql://localhost:3306/version_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=@Ashish12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
eureka.instance.prefer-ip-address=true
# ======================
# JPA / Hibernate Configuration
# ======================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ======================
# Eureka - Completely Disabled (Fix for your error)
# ======================
#eureka.client.enabled=false
#eureka.client.register-with-eureka=false
#eureka.client.fetch-registry=false

# Extra safety to prevent auto-registration
#spring.cloud.service-registry.auto-registration.enabled=false

# ======================
# Swagger / OpenAPI (Uncomment when needed)
# ======================
#springdoc.swagger-ui.path=/swagger-ui.html
#springdoc.api-docs.path=/v3/api-docs
# Force Swagger to use the Gateway URL for requests

# Ensure Swagger uses Gateway URL instead of direct port
server.forward-headers-strategy=framework

# Force Swagger to use relative URLs (fixes 'Failed to fetch' CORS errors)

# Final Fix: Explicitly set the Gateway as the API Server
springdoc.openapi.servers[0].url=http://localhost:8081
springdoc.openapi.servers[0].description=API Gateway (Centralized Entry)
