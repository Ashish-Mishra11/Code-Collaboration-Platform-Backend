spring.application.name=api-gateway
server.port=8081

#  Spring Boot 4 compatible Gateway routing 
# doing the routing from the API gateway for authservice
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# doing the routing from the API gateway for projectservice
spring.cloud.gateway.server.webflux.routes[1].id=project-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://project-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/project/**

#making it client of eureka server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Debug Logs 
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.reactive.DispatcherHandler=DEBUG
logging.level.reactor.netty.http.client=DEBUG

#tell Spring to Load .env file also
spring.config.import=optional:file:.env[.properties]
jwt.secret=${JWTSCRET}