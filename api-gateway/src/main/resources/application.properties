spring.application.name=api-gateway
server.port=8081

#  Spring Boot 4 compatible Gateway routing 
# doing the routing from the API gateway for authservice
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/oauth2/*,/api/admin/**



# doing the routing from the API gateway for projectservice
spring.cloud.gateway.server.webflux.routes[1].id=project-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://project-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/project/**

# doing the routing from the API gateway for editorservice
spring.cloud.gateway.server.webflux.routes[2].id=editor-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://editor-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/files/**

# doing the routing from the API gateway for collabservice
spring.cloud.gateway.server.webflux.routes[3].id=collab-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://collab-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/sessions/**

# WebSocket routing for collab service (SockJS)
spring.cloud.gateway.server.webflux.routes[7].id=collab-websocket
spring.cloud.gateway.server.webflux.routes[7].uri=lb:ws://collab-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/collab/**,/collab-ws/**


# doing the routing from the API gateway for version service
spring.cloud.gateway.server.webflux.routes[4].id=version-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://version-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/versions/**

# doing the routing from the API gateway for execution-service
spring.cloud.gateway.server.webflux.routes[5].id=execution-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://execution-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/executions/**

# doing the routing from the API gateway for payment-service
spring.cloud.gateway.server.webflux.routes[6].id=payment-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/payment/**

# doing the routing from the API gateway for notification-service
spring.cloud.gateway.server.webflux.routes[15].id=notification-service
spring.cloud.gateway.server.webflux.routes[15].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[15].predicates[0]=Path=/api/notifications/**

#making it client of eureka server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Debug Logs 
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.reactive.DispatcherHandler=DEBUG
logging.level.reactor.netty.http.client=DEBUG

#tell Spring to Load .env file also
spring.config.import=optional:file:.env[.properties]
jwt.secret=${JWT_SECRET:codesync_super_secret_key_do_not_share_ever_2024}

# ============================================================
#  CENTRALIZED SWAGGER – SpringDoc OpenAPI Aggregation
# ============================================================

# ── Routes: forward /v3/api-docs/{service} to each service ──
spring.cloud.gateway.server.webflux.routes[8].id=auth-service-swagger
spring.cloud.gateway.server.webflux.routes[8].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/v3/api-docs/auth-service
spring.cloud.gateway.server.webflux.routes[8].filters[0]=RewritePath=/v3/api-docs/auth-service, /v3/api-docs

spring.cloud.gateway.server.webflux.routes[9].id=project-service-swagger
spring.cloud.gateway.server.webflux.routes[9].uri=lb://project-service
