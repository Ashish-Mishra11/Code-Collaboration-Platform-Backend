spring.cloud.gateway.server.webflux.routes[12].id=version-service-swagger
spring.cloud.gateway.server.webflux.routes[12].uri=lb://version-service
spring.cloud.gateway.server.webflux.routes[12].predicates[0]=Path=/v3/api-docs/version-service
spring.cloud.gateway.server.webflux.routes[12].filters[0]=RewritePath=/v3/api-docs/version-service, /v3/api-docs

spring.cloud.gateway.server.webflux.routes[13].id=execution-service-swagger
spring.cloud.gateway.server.webflux.routes[13].uri=lb://execution-service
spring.cloud.gateway.server.webflux.routes[13].predicates[0]=Path=/v3/api-docs/execution-service
spring.cloud.gateway.server.webflux.routes[13].filters[0]=RewritePath=/v3/api-docs/execution-service, /v3/api-docs

spring.cloud.gateway.server.webflux.routes[14].id=payment-service-swagger
spring.cloud.gateway.server.webflux.routes[14].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[14].predicates[0]=Path=/v3/api-docs/payment-service
spring.cloud.gateway.server.webflux.routes[14].filters[0]=RewritePath=/v3/api-docs/payment-service, /v3/api-docs

spring.cloud.gateway.server.webflux.routes[16].id=notification-service-swagger
spring.cloud.gateway.server.webflux.routes[16].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[16].predicates[0]=Path=/v3/api-docs/notification-service
spring.cloud.gateway.server.webflux.routes[16].filters[0]=RewritePath=/v3/api-docs/notification-service, /v3/api-docs

# ── SpringDoc: Swagger UI hosted at the gateway ──────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# One entry per microservice – appears in the Swagger UI top-right dropdown
springdoc.swagger-ui.urls[0].url=/v3/api-docs/auth-service
springdoc.swagger-ui.urls[0].name=Auth Service (port 8080)

springdoc.swagger-ui.urls[1].url=/v3/api-docs/project-service
springdoc.swagger-ui.urls[1].name=Project Service (port 8082)

springdoc.swagger-ui.urls[2].url=/v3/api-docs/editor-service
springdoc.swagger-ui.urls[2].name=Editor Service (port 8083)

springdoc.swagger-ui.urls[3].url=/v3/api-docs/collab-service
springdoc.swagger-ui.urls[3].name=Collab Service (port 8084)

springdoc.swagger-ui.urls[4].url=/v3/api-docs/version-service
springdoc.swagger-ui.urls[4].name=Version Service (port 8085)

springdoc.swagger-ui.urls[5].url=/v3/api-docs/execution-service
springdoc.swagger-ui.urls[5].name=Execution Service (port 8086)

springdoc.swagger-ui.urls[6].url=/v3/api-docs/payment-service
springdoc.swagger-ui.urls[6].name=Payment Service (port 8095)

springdoc.swagger-ui.urls[7].url=/v3/api-docs/notification-service
springdoc.swagger-ui.urls[7].name=Notification Service (port 8096)

# Show "Authorize" button (JWT Bearer) for all services
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha