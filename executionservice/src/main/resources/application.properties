spring.application.name=execution-service
server.port=8086

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/executiondb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=@Ashish12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Connection Pool ────────────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Async Thread Pool ──────────────────────────────────────────────────────────
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.pool.keep-alive=60s
spring.task.execution.thread-name-prefix=execution-worker-

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.executionservice=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true


# -- SpringDoc OpenAPI ------------------------------------------
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Force Swagger to use the Gateway URL for requests

# Ensure Swagger uses Gateway URL instead of direct port
server.forward-headers-strategy=framework

# Force Swagger to use relative URLs (fixes 'Failed to fetch' CORS errors)

# Final Fix: Explicitly set the Gateway as the API Server
springdoc.openapi.servers[0].url=http://localhost:8081
springdoc.openapi.servers[0].description=API Gateway (Centralized Entry)
