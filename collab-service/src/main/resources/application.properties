spring.application.name=collab-service
server.port=8084

#tell Spring to Load .env file also
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/collab_session?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQLPASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG
logging.level.com.codesync.auth=DEBUG

eureka.instance.prefer-ip-address=true
# -- SpringDoc OpenAPI ------------------------------------------
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Force Swagger to use the Gateway URL for requests

# Ensure Swagger uses Gateway URL instead of direct port
server.forward-headers-strategy=framework

# Force Swagger to use relative URLs (fixes 'Failed to fetch' CORS errors)

# Final Fix: Explicitly set the Gateway as the API Server
springdoc.openapi.servers[0].url=http://localhost:8081
springdoc.openapi.servers[0].description=API Gateway (Centralized Entry)
