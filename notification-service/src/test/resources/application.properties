spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=notification-group-test

# Mail (disabled in tests — JavaMailSender is mocked)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@codesync.com
spring.mail.password=testpassword

# Eureka disabled in tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Logging
logging.level.com.codesync.notification=DEBUG
logging.level.org.springframework.kafka=WARN
