# ─────────────────────────────────────────────────────────────────────────────
# SonarQube Project Configuration
# Run:  mvn -f fixed-backend/pom.xml clean verify sonar:sonar
#        -Dsonar.token=<your-sonar-token>
# ─────────────────────────────────────────────────────────────────────────────

# Project identification (shown in SonarQube dashboard as ONE project)
sonar.projectKey=codesync-backend
sonar.projectName=CodeSync Backend
sonar.projectVersion=1.0.0

# SonarQube server URL (change to your actual URL if not local)
sonar.host.url=http://localhost:9000

# Source encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=java

# ── Source & Test roots ───────────────────────────────────────────────────────
# SonarQube discovers these automatically from the Maven module graph,
# but listing them explicitly makes sure NOTHING is missed.
sonar.sources=\
  auth-service/src/main/java,\
  payment-service/src/main/java,\
  notification-service/src/main/java,\
  collab-service/src/main/java,\
  editor-service/src/main/java,\
  project-service/src/main/java,\
  executionservice/src/main/java,\
  versionservice/src/main/java,\
  api-gateway/src/main/java,\
  serviceregistry/src/main/java

sonar.tests=\
  auth-service/src/test/java,\
  payment-service/src/test/java,\
  notification-service/src/test/java,\
  collab-service/src/test/java,\
  editor-service/src/test/java,\
  project-service/src/test/java,\
  executionservice/src/test/java,\
  versionservice/src/test/java,\
  api-gateway/src/test/java,\
  serviceregistry/src/test/java

# ── JaCoCo coverage report paths ─────────────────────────────────────────────
sonar.coverage.jacoco.xmlReportPaths=\
  auth-service/target/site/jacoco/jacoco.xml,\
  payment-service/target/site/jacoco/jacoco.xml,\
  notification-service/target/site/jacoco/jacoco.xml,\
  collab-service/target/site/jacoco/jacoco.xml,\
  editor-service/target/site/jacoco/jacoco.xml,\
  project-service/target/site/jacoco/jacoco.xml,\
  executionservice/target/site/jacoco/jacoco.xml,\
  versionservice/target/site/jacoco/jacoco.xml,\
  api-gateway/target/site/jacoco/jacoco.xml,\
  serviceregistry/target/site/jacoco/jacoco.xml

# ── Exclusions (generated / infra code not counted toward coverage) ───────────
sonar.exclusions=\
  **/config/**,\
  **/configuration/**,\
  **/*Application.java,\
  **/entity/**,\
  **/dto/**,\
  **/exception/**,\
  **/kafka/KafkaProducerConfig.java,\
  **/kafka/KafkaConsumerConfig.java,\
  **/kafka/KafkaTopics.java

sonar.coverage.exclusions=\
  **/config/**,\
  **/configuration/**,\
  **/*Application.java,\
  **/entity/**,\
  **/dto/**,\
  **/exception/**,\
  **/kafka/KafkaProducerConfig.java,\
  **/kafka/KafkaConsumerConfig.java,\
  **/kafka/KafkaTopics.java

# ── Quality Gate ──────────────────────────────────────────────────────────────
# Minimum line coverage target: 80 %
# (enforced both by JaCoCo <check> goal and the SonarQube Quality Gate)
sonar.java.coveragePlugin=jacoco
