
spring.application.name=auth-service
#eureka server 
server.port=8080
#tell Spring to Load .env file also
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/user?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQLPASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG
logging.level.com.codesync.auth=DEBUG

#logging feature help in debug issue 
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.boot.autoconfigure.security=DEBUG
# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

# Google Oauth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

#reset password using Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

jwt.secret=${JWT_SECRET:codesync_super_secret_key_do_not_share_ever_2024}


#making it client of eureka server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Register this service with Eureka Server
eureka.client.register-with-eureka=true
# Fetch registry from Eureka Server (to discover other services)
eureka.client.fetch-registry=true
# Prefer IP address instead of hostname
eureka.instance.prefer-ip-address=true
# -- SpringDoc OpenAPI ------------------------------------------
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Force Swagger to use the Gateway URL for requests

# Ensure Swagger uses Gateway URL instead of direct port
server.forward-headers-strategy=framework

# Force Swagger to use relative URLs (fixes 'Failed to fetch' CORS errors)

# Final Fix: Explicitly set the Gateway as the API Server
springdoc.openapi.servers[0].url=http://localhost:8081
springdoc.openapi.servers[0].description=API Gateway (Centralized Entry)

# ── Apache Kafka Producer ───────────────────────────────────────────────
# Kafka runs in KRaft mode via Docker (docker-compose.yml at project root)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
